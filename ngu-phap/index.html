<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Ngữ pháp TOEIC · AZTOEIC Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Baloo+2:wght@700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#fdfcfa; --paper-2:#f2efe9; --ink:#181310; --ink-soft:#655c54; --line:#e4ded3;
    --red:#b3122e; --red-deep:#7a0a1f; --red-ink:#7a0a1f;
    --gold:#96650a; --gold-bg:#f6efdd;
    --green:#1e7a4c; --green-bg:#e7f4ec;
    --amber:#96650a; --amber-bg:#f6efdd;
    --card-shadow: 0 1px 0 rgba(24,19,16,.05), 0 22px 44px -26px rgba(24,19,16,.4);
    --focus: 0 0 0 3px rgba(179,18,46,.28);
    --font-display:"Lora","Georgia",serif;
    --font-body:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#15120f; --paper-2:#1e1a16; --ink:#f4efe9; --ink-soft:#b9ada2; --line:#332c25;
      --red:#e6415c; --red-deep:#ff8a94; --red-ink:#ff8a94;
      --gold:#dba746; --gold-bg:#2e2515;
      --green:#5fd394; --green-bg:#173226;
      --amber:#dba746; --amber-bg:#2e2515;
      --card-shadow: 0 1px 0 rgba(0,0,0,.25), 0 24px 48px -24px rgba(0,0,0,.65);
      --focus: 0 0 0 3px rgba(230,65,92,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#15120f; --paper-2:#1e1a16; --ink:#f4efe9; --ink-soft:#b9ada2; --line:#332c25;
    --red:#e6415c; --red-deep:#ff8a94; --red-ink:#ff8a94;
    --gold:#dba746; --gold-bg:#2e2515;
    --green:#5fd394; --green-bg:#173226;
    --amber:#dba746; --amber-bg:#2e2515;
    --card-shadow: 0 1px 0 rgba(0,0,0,.25), 0 24px 48px -24px rgba(0,0,0,.65);
    --focus: 0 0 0 3px rgba(230,65,92,.35);
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --paper:#fdfcfa; --paper-2:#f2efe9; --ink:#181310; --ink-soft:#655c54; --line:#e4ded3;
    --red:#b3122e; --red-deep:#7a0a1f; --red-ink:#7a0a1f;
    --gold:#96650a; --gold-bg:#f6efdd;
    --green:#1e7a4c; --green-bg:#e7f4ec;
    --amber:#96650a; --amber-bg:#f6efdd;
    --card-shadow: 0 1px 0 rgba(24,19,16,.05), 0 22px 44px -26px rgba(24,19,16,.4);
    --focus: 0 0 0 3px rgba(179,18,46,.28);
    color-scheme: light;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); }
  .wrap{ max-width:760px; margin:0 auto; padding:20px 14px 70px; }
  .banner{ display:flex; align-items:center; gap:14px; padding-bottom:16px; border-bottom:2px solid var(--ink); margin-bottom:20px; }
  .logo{ width:46px; height:46px; border-radius:12px; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--font-display); font-size:18px; flex:none; }
  .brand small{ display:block; font-size:11px; font-weight:800; letter-spacing:.08em; color:var(--red); text-transform:uppercase; }
  .brand h1{ margin:2px 0 0; font-family:var(--font-display); font-size:19px; font-weight:700; cursor:pointer; }
  .themeBtn{ margin-left:auto; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--paper-2); cursor:pointer; font-size:16px; flex:none; }
  .panel{ background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:var(--card-shadow); padding:22px; margin-bottom:16px; }
  .panel h2{ margin:0 0 10px; font-family:var(--font-display); }
  .desc{ color:var(--ink-soft); font-size:14px; line-height:1.65; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; padding:12px 18px; font-weight:700; font-size:14px; border:1px solid transparent; cursor:pointer; text-decoration:none; }
  .btn-primary{ background:var(--red); color:#fff; }
  .btn-ghost{ background:var(--paper-2); color:var(--ink); border-color:var(--line); }
  .btn-sm{ padding:8px 14px; font-size:12.5px; border-radius:10px; }
  .btn:focus-visible{ outline:none; box-shadow:var(--focus); }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  /* ---- hero / stats ---- */
  .hero-card{ position:relative; overflow:hidden; background:linear-gradient(165deg, var(--paper) 0%, var(--paper-2) 120%); border:1px solid var(--line); border-radius:20px; padding:26px 24px; box-shadow:var(--card-shadow); margin-bottom:18px; }
  .hero-card::after{ content:""; position:absolute; top:-60px; right:-60px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(179,18,46,.14), transparent 70%); pointer-events:none; }
  .hero-eyebrow{ font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--red); margin-bottom:8px; }
  .hero-card h2{ font-family:var(--font-display); font-size:22px; line-height:1.32; margin:0 0 8px; max-width:32ch; }
  .stat-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .stat-chip{ flex:1; min-width:100px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px 14px; text-align:center; }
  .stat-chip b{ display:block; font-family:var(--font-display); font-size:20px; color:var(--red); }
  .stat-chip span{ font-size:11px; color:var(--ink-soft); font-weight:600; }

  /* ---- topic cards ---- */
  .topic-card{ display:block; border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; background:var(--paper); box-shadow:var(--card-shadow); text-decoration:none; color:var(--ink); cursor:pointer; }
  .topic-card-top{ display:flex; align-items:center; gap:12px; }
  .topic-num{ flex:none; width:34px; height:34px; border-radius:10px; background:var(--paper-2); display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--font-display); color:var(--red); font-size:15px; }
  .topic-title{ font-family:var(--font-display); font-size:16px; font-weight:700; margin:0; }
  .topic-sub{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .topic-arrow{ margin-left:auto; color:var(--ink-soft); font-size:16px; flex:none; }
  .progress-track{ height:7px; border-radius:99px; background:var(--paper-2); margin-top:12px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--red); border-radius:99px; transition:width .3s; }
  .progress-label{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; font-weight:600; }

  /* ---- dashboard v2: gọn, có nhóm gập, ảnh AZ ---- */
  .hero-az{ position:relative; overflow:hidden; border-radius:20px; margin-bottom:14px; padding:22px 22px 20px; color:#fff; background:#b3122e; box-shadow:var(--card-shadow); }
  .hero-az > *{ position:relative; }
  .hero-az .hero-eyebrow{ color:#ffd7dc; margin-bottom:6px; }
  .hero-az h2{ font-family:var(--font-display); font-size:21px; line-height:1.3; margin:0 0 12px; max-width:26ch; color:#fff; }
  .hero-meta{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .hero-nums{ display:flex; gap:16px; font-size:12px; color:#f3e3e5; }
  .hero-nums b{ font-family:var(--font-display); font-size:17px; color:#fff; margin-right:4px; }
  .btn-light{ background:#fff; color:#b3122e; }
  .results{ margin-bottom:14px; }
  .results-h{ font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin:0 2px 8px; }
  .results-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x mandatory; }
  .result-card{ flex:none; width:132px; scroll-snap-align:start; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:var(--paper); box-shadow:var(--card-shadow); }
  .result-card img{ display:block; width:100%; height:128px; object-fit:cover; object-position:center 55%; }
  .result-card div{ padding:6px 8px 8px; font-size:11px; color:var(--ink-soft); line-height:1.35; }
  .result-card b{ display:block; font-family:var(--font-display); font-size:15px; color:var(--red); }
  details.tgroup{ border:1px solid var(--line); border-radius:14px; background:var(--paper); margin-bottom:10px; box-shadow:var(--card-shadow); overflow:hidden; }
  details.tgroup > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:14px 16px; font-family:var(--font-display); font-weight:700; font-size:15.5px; }
  details.tgroup > summary::-webkit-details-marker{ display:none; }
  details.tgroup > summary .g-count{ margin-left:auto; font-family:var(--font-body); font-size:11.5px; font-weight:700; color:var(--ink-soft); }
  details.tgroup > summary::after{ content:"›"; color:var(--ink-soft); transition:transform .2s; font-size:18px; }
  details.tgroup[open] > summary::after{ transform:rotate(90deg); }
  details.tmain{ margin-bottom:10px; } details.tmain > summary{ font-size:17px; } .tmain-in{ padding:2px 10px 10px; } .tmain-in details.tgroup{ box-shadow:none; }
  .results{ margin-top:16px; }
  .trow{ display:flex; align-items:center; gap:12px; padding:11px 16px; border-top:1px solid var(--line); cursor:pointer; }
  .trow:hover{ background:var(--paper-2); }
  .trow .topic-num{ width:28px; height:28px; font-size:13px; border-radius:8px; }
  .trow-t{ flex:1; min-width:0; }
  .trow-t b{ display:block; font-size:14px; font-weight:700; }
  .trow-t span{ display:block; font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trow-t b{ line-height:1.3; }
  .trow-p{ flex:none; width:54px; text-align:right; font-size:11.5px; font-weight:700; color:var(--ink-soft); }
  .trow-p i{ display:block; height:4px; border-radius:99px; background:var(--paper-2); margin-top:4px; overflow:hidden; }
  .trow-p i u{ display:block; height:100%; background:var(--red); text-decoration:none; }
  .az-community{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 4px; }
  .az-community img{ width:100%; height:110px; object-fit:cover; border-radius:14px; border:1px solid var(--line); }
  .az-tag{ text-align:center; font-size:12px; color:var(--ink-soft); margin:8px 0 0; }

  /* ---- Đầu trang + trang chủ lấy nguyên từ grammar-trainer-mockup.html ---- */
  .nb-top{ position:sticky; top:0; z-index:50; background:#fffaf7; border-bottom:4px solid #161012; }
  .nb-top-in{ max-width:1120px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:16px; }
  .nb-logo{ display:flex; align-items:center; gap:10px; font:800 20px/1 "Baloo 2","Be Vietnam Pro",sans-serif; text-decoration:none; color:#161012; cursor:pointer; }
  .nb-logo i{ display:grid; place-items:center; width:40px; height:40px; background:#e0102b; color:#fff; border-radius:10px; font:800 17px/1 "Be Vietnam Pro",sans-serif; font-style:normal; letter-spacing:-.02em; border:3px solid #161012; box-shadow:3px 3px 0 #161012; }
  .nb-logo span{ color:#e0102b; }
  .nb-nav{ margin-left:auto; display:flex; gap:10px; align-items:center; }
  .nb-chip{ border:3px solid #161012; background:#fff; border-radius:999px; padding:6px 14px; font:600 14px/1 "Be Vietnam Pro",sans-serif; box-shadow:3px 3px 0 #161012; white-space:nowrap; color:#161012; }
  .nb-chip.soft{ background:#ffe3e1; }
  @media (max-width:640px){ .nb-hide-sm{ display:none; } .nb-top-in{ padding:10px 14px; } }
  .wrap.nb-wide{ max-width:1120px; padding-inline:20px; }
  .wrap{ padding-top:24px; }

  .nb-hero{ display:grid; grid-template-columns:1.15fr .85fr; gap:24px; align-items:center; padding-block:16px 24px; }
  .nb-hero .eyebrow{ font:700 12px/1 "Be Vietnam Pro",sans-serif; letter-spacing:.12em; text-transform:uppercase; color:#e0102b; margin:0 0 14px; }
  .nb-hero h1{ font:800 clamp(36px,6.4vw,70px)/1.05 "Baloo 2","Be Vietnam Pro",sans-serif; margin:0; color:#161012; text-wrap:balance; }
  .nb-hero h1 .hlw{ background:linear-gradient(transparent 52%,#ffe45c 52%,#ffe45c 92%,transparent 92%); padding:0 .08em; }
  .nb-hero h1 em{ font-style:normal; color:#fff; background:#e0102b; padding:0 .18em; border:4px solid #161012; border-radius:10px; box-shadow:6px 6px 0 #161012; display:inline-block; transform:rotate(-2deg); margin-top:.12em; }
  .nb-hero-p{ max-width:34em; color:#5e5153; margin:22px 0 26px; font-size:16px; line-height:1.55; }
  .nb-btn{ display:inline-flex; align-items:center; gap:10px; font:700 16px/1 "Be Vietnam Pro",sans-serif; padding:16px 22px; border:4px solid #161012; border-radius:12px; background:#e0102b; color:#fff; box-shadow:6px 6px 0 #161012; cursor:pointer; transition:transform .2s ease-out,box-shadow .2s ease-out; text-decoration:none; }
  .nb-btn:hover{ transform:translate(-2px,-3px); box-shadow:9px 9px 0 #161012; }
  .nb-btn:active{ transform:translate(4px,4px); box-shadow:2px 2px 0 #161012; }
  .nb-btn:focus-visible, .nb-card:focus-visible, .nb-book:focus-visible{ outline:3px dashed #e0102b; outline-offset:4px; }
  .nb-hero-art{ position:relative; aspect-ratio:1; max-width:400px; width:100%; justify-self:center; }
  .nb-hero-art svg{ width:100%; height:100%; overflow:visible; }
  .nb-burst{ animation:nbspin 40s linear infinite; transform-origin:50% 50%; }
  @keyframes nbspin{ to{ transform:rotate(360deg); } }
  .nb-bubble{ position:absolute; top:4%; left:-4%; background:#fff; border:3px solid #161012; border-radius:16px; padding:8px 14px; font:700 15px/1.2 "Be Vietnam Pro",sans-serif; box-shadow:4px 4px 0 #161012; transform:rotate(-4deg); max-width:75%; color:#161012; }
  .nb-blink{ animation:nbblink 5s infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes nbblink{ 0%,94%,100%{ transform:scaleY(1); } 96%{ transform:scaleY(.1); } }
  @media (max-width:760px){ .nb-hero{ grid-template-columns:1fr; } .nb-hero-art{ max-width:280px; } }

  .nb-goal{ display:flex; flex-wrap:wrap; gap:12px 28px; align-items:center; border:4px solid #161012; border-radius:14px; background:#fff; padding:16px 20px; box-shadow:8px 8px 0 #161012; color:#161012; }
  .nb-goal .k{ font-size:13px; color:#5e5153; }
  .nb-goal .v{ font:800 26px/1 "Baloo 2","Be Vietnam Pro",sans-serif; font-variant-numeric:tabular-nums; }
  .nb-goal .bar{ flex:1 1 220px; min-width:0; }
  .nb-meter{ height:16px; border:3px solid #161012; border-radius:999px; background:#ffe3e1; overflow:hidden; margin-top:6px; }
  .nb-meter i{ display:block; height:100%; background:#e0102b; border-right:3px solid #161012; }
  .nb-sec{ display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; margin:46px 0 20px; scroll-margin-top:90px; }
  .nb-sec h2{ font:800 clamp(28px,4vw,40px)/1.05 "Baloo 2","Be Vietnam Pro",sans-serif; margin:0; color:#161012; }
  .nb-sec p{ margin:6px 0 0; color:#5e5153; max-width:40em; font-size:15px; }

  .nb-cards{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:26px; }
  @media (max-width:700px){ .nb-cards{ grid-template-columns:1fr; } }
  .nb-card{ position:relative; display:flex; flex-direction:column; min-height:300px; overflow:hidden; border:4px solid #161012; border-radius:10px; background:var(--c,#e0102b); color:#fff; box-shadow:8px 8px 0 #161012; text-decoration:none; padding:22px; cursor:pointer; transition:transform .3s cubic-bezier(0,0,.2,1),box-shadow .3s cubic-bezier(0,0,.2,1); }
  .nb-card:hover{ transform:translateY(-6px); box-shadow:12px 12px 0 #161012; }
  .nb-card .ico{ width:48px; height:48px; display:grid; place-items:center; background:#fff; border:3px solid #161012; border-radius:12px; color:#161012; }
  .nb-card .ico svg{ width:26px; height:26px; }
  .nb-card h3{ font:800 36px/1.05 "Baloo 2","Be Vietnam Pro",sans-serif; margin:16px 0 0; }
  .nb-card p{ font-size:14.5px; line-height:1.5; margin:6px 0 0; max-width:22em; position:relative; z-index:1; }
  .nb-card ul{ list-style:none; padding:0; margin:14px 0 0; display:flex; flex-wrap:wrap; gap:8px; max-width:60%; position:relative; z-index:1; }
  .nb-card li{ border:2px solid #fff; border-radius:999px; padding:3px 10px; font-size:12.5px; font-weight:600; }
  .nb-card .mascot{ position:absolute; right:-6px; bottom:-40px; width:46%; max-width:230px; transition:transform .35s cubic-bezier(.3,1.6,.5,1); }
  .nb-card:hover .mascot{ transform:translateY(-14px) rotate(-3deg); }
  .nb-card .tag{ align-self:flex-start; background:#161012; color:#fff; border:3px solid #fff; border-radius:999px; padding:6px 14px; font:700 12.5px/1 "Be Vietnam Pro",sans-serif; letter-spacing:.06em; position:relative; z-index:1; margin-top:auto; }
  .nb-card .tag + .tag{ display:none; }
  .nb-card ul + .tag{ margin-top:22px; }

  .nb-panel{ margin:28px 0 0; color:#161012; }
  .nb-panel .nb-sec{ margin:0 0 14px; }
  .nb-panel .nb-sec h2{ font-size:24px; }
  .nb-legend{ display:flex; gap:16px; flex-wrap:wrap; margin:0 0 16px; font-size:12.5px; color:#5e5153; }
  .nb-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .nb-legend i{ width:14px; height:14px; border-radius:4px; border:2px solid #161012; display:inline-block; }
  .nb-books{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:16px; }
  @media (max-width:900px){ .nb-books{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (max-width:520px){ .nb-books{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .nb-book{ display:flex; flex-direction:column; gap:8px; border:3px solid #161012; border-radius:10px; background:#fff; box-shadow:5px 5px 0 #161012; padding:12px; text-decoration:none; color:#161012; cursor:pointer; transition:transform .2s,box-shadow .2s; }
  .nb-book:hover{ transform:translate(-2px,-4px); box-shadow:8px 9px 0 #161012; }
  .nb-book .spine{ height:9px; border-radius:4px; background:var(--bc,#e0102b); border:2px solid #161012; }
  .nb-book .num{ font:800 20px/1 "Baloo 2","Be Vietnam Pro",sans-serif; color:var(--bc,#e0102b); }
  .nb-book b{ font:800 13.5px/1.25 "Baloo 2","Be Vietnam Pro",sans-serif; min-height:2.5em; }
  .nb-book small{ color:#5e5153; font-size:11px; }
  .nb-book .row{ display:flex; gap:5px; }
  .nb-book .row i{ flex:1; height:8px; border:2px solid #161012; border-radius:3px; background:#fff; }
  .nb-book .row i.on{ background:var(--bc,#e0102b); }
  .nb-scores{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  @media (max-width:520px){ .nb-scores{ gap:10px; } }
  .nb-scores .nb-book img{ width:100%; border-radius:6px; border:2px solid #161012; aspect-ratio:1/1; object-fit:cover; }
  .nb-scores .nb-book b{ font-size:20px; min-height:0; margin-top:4px; }
  .nb-foot{ margin:48px 0 20px; color:#5e5153; font-size:14px; text-align:center; }
  @media (prefers-reduced-motion:reduce){ .nb-burst, .nb-blink{ animation:none !important; } .nb-card, .nb-book, .nb-btn, .nb-card .mascot{ transition:none !important; } }

  /* ---- topic detail ---- */
  .backlink{ display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px; font-weight:700; text-decoration:none; margin-bottom:14px; cursor:pointer; }
  .theory-group{ margin-bottom:18px; }
  .theory-group h3{ font-family:var(--font-display); font-size:15px; margin:0 0 10px; color:var(--red-ink); }
  .tense-card{ border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; background:var(--paper-2); }
  .tense-card h4{ margin:0 0 6px; font-size:14px; font-family:var(--font-display); }
  .tense-form{ font-size:12.5px; font-weight:700; color:var(--gold); background:var(--gold-bg); display:inline-block; padding:3px 9px; border-radius:8px; margin-bottom:8px; }
  .tense-card ul{ margin:6px 0; padding-left:18px; font-size:13px; line-height:1.6; }
  .tense-signals{ font-size:12px; color:var(--ink-soft); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .tip-list{ font-size:13.5px; line-height:1.7; padding-left:18px; }
  .accordion-toggle{ display:flex; align-items:center; justify-content:space-between; width:100%; background:none; border:none; padding:0; cursor:pointer; color:var(--ink); font-family:var(--font-body); }
  .accordion-toggle .chev{ transition:transform .2s; color:var(--ink-soft); }
  .accordion-toggle.open .chev{ transform:rotate(180deg); }
  .accordion-body{ display:none; margin-top:14px; }
  .accordion-body.open{ display:block; }

  .quiz-row{ display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:9px; }
  .quiz-row-title{ font-size:13.5px; font-weight:700; }
  .quiz-row-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .score-badge{ flex:none; font-size:11.5px; font-weight:800; padding:4px 10px; border-radius:99px; background:var(--paper-2); color:var(--ink-soft); }
  .score-badge.good{ background:var(--green-bg); color:var(--green); }
  .score-badge.mid{ background:var(--amber-bg); color:var(--amber); }
  .quiz-row-cta{ margin-left:auto; flex:none; }

  /* ---- vocab table ---- */
  .vocab-item{ border-bottom:1px solid var(--line); padding:12px 0; }
  .vocab-item:last-child{ border-bottom:none; }
  .vocab-word{ font-weight:800; font-family:var(--font-display); font-size:14.5px; }
  .vocab-ipa{ color:var(--ink-soft); font-size:12px; margin-left:6px; }
  .vocab-meaning{ color:var(--red-ink); font-weight:700; font-size:13px; margin:3px 0; }
  .vocab-example{ font-size:13px; font-style:italic; color:var(--ink-soft); }
  .vocab-note{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }

  /* ---- quiz-taking ---- */
  .mode-select{ display:flex; gap:10px; flex-wrap:wrap; }
  .mode-card{ flex:1; min-width:150px; border:1.5px solid var(--line); border-radius:14px; padding:16px; cursor:pointer; text-align:left; background:var(--paper); }
  .mode-card:hover{ border-color:var(--red); }
  .mode-card h4{ margin:0 0 4px; font-family:var(--font-display); font-size:14.5px; }
  .mode-card p{ margin:0; font-size:12px; color:var(--ink-soft); line-height:1.5; }
  .quiz-note{ background:var(--gold-bg); color:var(--gold); font-size:12px; border-radius:10px; padding:9px 12px; margin-bottom:14px; }
  .q-block{ border-bottom:1px solid var(--line); padding:18px 0; }
  .q-block:first-child{ padding-top:0; }
  .q-block:last-child{ border-bottom:none; }
  .q-num{ font-weight:800; color:var(--red); font-size:13px; margin-bottom:6px; }
  .q-text{ font-size:15.5px; line-height:1.65; margin:0 0 10px; }
  .opt-row{ display:flex; flex-direction:column; gap:8px; }
  .opt-btn{ text-align:left; border:1.5px solid var(--line); background:var(--paper); border-radius:10px; padding:11px 14px; font-size:14.5px; line-height:1.5; cursor:pointer; display:flex; gap:10px; align-items:flex-start; font-family:var(--font-body); }
  .opt-btn b{ flex:none; width:20px; height:20px; border-radius:50%; background:var(--paper-2); display:flex; align-items:center; justify-content:center; font-size:11.5px; }
  .opt-btn.selected{ border-color:var(--red); background:var(--amber-bg); }
  .opt-btn.selected b{ background:var(--red); color:#fff; }
  .opt-btn.correct{ border-color:var(--green); background:var(--green-bg); color:var(--green); }
  .opt-btn.correct b{ background:var(--green); color:#fff; }
  .opt-btn.wrong{ border-color:var(--red); background:var(--gold-bg); }
  .opt-btn.wrong b{ background:var(--red); color:#fff; }
  .opt-btn[disabled]{ cursor:default; }
  .explain-box{ margin-top:10px; font-size:12.5px; line-height:1.6; background:var(--paper-2); border-radius:10px; padding:10px 12px; color:var(--ink-soft); }
  .explain-box b{ color:var(--ink); }
  .quiz-toolbar{ position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line); padding:12px 0; margin-top:6px; display:flex; align-items:center; gap:10px; }
  .quiz-progress{ font-size:12.5px; color:var(--ink-soft); font-weight:700; }

  .result-panel{ background:linear-gradient(155deg, var(--red) 0%, var(--red-deep) 100%); color:#fff; border-radius:20px; padding:26px; margin-bottom:18px; box-shadow:var(--card-shadow); text-align:center; }
  .result-panel .score-num{ font-family:var(--font-display); font-size:40px; margin:6px 0; }
  .result-panel .score-msg{ font-size:13.5px; color:rgba(255,255,255,.88); }
  .result-panel .btn-primary{ background:#fff; color:var(--red-deep); }

  /* ---- gate ---- */
  #gateScreen{ position:fixed; inset:0; z-index:999; background:var(--paper); display:flex; align-items:center; justify-content:center; padding:20px; }
  .gate-card{ max-width:400px; width:100%; background:var(--paper); border:1px solid var(--line); border-radius:20px; box-shadow:var(--card-shadow); padding:30px 26px; }
  .gate-card .logo{ margin:0 auto 14px; }
  .gate-card h2{ text-align:center; font-family:var(--font-display); margin:0 0 6px; font-size:20px; }
  .gate-card .desc{ text-align:center; margin-bottom:20px; }
  .gate-field{ margin-bottom:12px; }
  .gate-field label{ display:block; font-size:12px; font-weight:700; margin-bottom:5px; color:var(--ink-soft); }
  .gate-field input{ width:100%; padding:12px 13px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); font-size:14px; font-family:var(--font-body); }
  .gate-field input:focus{ outline:none; border-color:var(--red); box-shadow:var(--focus); }
  .gate-privacy{ font-size:11px; color:var(--ink-soft); text-align:center; margin-top:12px; line-height:1.5; }
  .gate-error{ color:var(--red); font-size:12.5px; margin-top:8px; display:none; }

  .hidden{ display:none !important; }

  /* ---- Part 7 — AZ Daily 15 ---- */
  .p7-tag{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--gold); }
  .p7-formula{ font-size:12px; font-weight:700; color:var(--ink-soft); letter-spacing:.02em; margin-top:8px; }
  .p7-passage-para{ font-size:15.5px; line-height:1.8; margin-bottom:12px; }
  .p7-passage-vi{ font-size:14px; line-height:1.75; color:var(--ink-soft); margin-top:6px; padding-left:10px; border-left:2px solid var(--line); }
  .p7-toggle-row{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:14px; }
  .p7-toggle-row button{ flex:1; padding:9px; font-size:12px; font-weight:700; border:none; background:var(--paper); color:var(--ink); cursor:pointer; font-family:var(--font-body); }
  .p7-toggle-row button.active{ background:var(--red); color:#fff; }
  .p7-chunk-list{ margin-top:16px; }
  .p7-chunk-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; border-bottom:1px solid var(--line); padding:11px 0; }
  .p7-chunk-row:last-child{ border-bottom:none; }
  .p7-chunk-en{ font-weight:700; font-size:14.5px; }
  .p7-chunk-vi{ font-size:13.5px; color:var(--ink-soft); margin-top:3px; }
  mark.p7-hl{ background:var(--gold-bg); color:var(--red-ink); font-weight:700; border-radius:3px; padding:1px 3px; }
  mark.p7-hl-click{ cursor:pointer; border-bottom:1.5px dashed var(--gold); transition:background .15s; }
  mark.p7-hl-click:hover, mark.p7-hl-click:focus-visible, mark.p7-hl-click.p7-hl-active{ background:var(--gold); color:#fff; outline:none; }
  .p7-pop{ position:absolute; z-index:500; max-width:min(360px, calc(100vw - 16px)); background:var(--paper); color:var(--ink); border:1px solid var(--line); border-left:3px solid var(--red); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.18); padding:10px 12px; }
  .p7-pop-en{ font-weight:700; font-size:14px; }
  .p7-pop-vi{ font-size:14px; color:var(--ink-soft); margin-top:4px; line-height:1.5; }
  .p7-kw{ cursor:pointer; background:var(--gold-bg); color:var(--red-ink); border-bottom:1.5px dashed var(--gold); border-radius:3px; padding:0 3px; transition:background .15s; }
  .p7-kw:hover, .p7-kw:focus-visible, .p7-kw.p7-hl-active{ background:var(--gold); color:#fff; outline:none; }
  .p7-kw-item{ font-size:13.5px; line-height:1.5; padding:3px 0; }
  .p7-kw-vi{ color:var(--ink-soft); }
  .p7-pos{ display:inline-block; font-size:11px; font-weight:800; color:var(--gold); background:var(--gold-bg); border-radius:6px; padding:0 6px; margin-right:2px; font-style:italic; }
  .p7-pop-ex{ margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  .p7-pop-ex-label{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:3px; }
  .p7-pop-ex-en{ font-size:13.5px; line-height:1.55; }
  .p7-pop-ex-vi{ font-size:13px; line-height:1.55; color:var(--ink-soft); font-style:italic; margin-top:3px; }
  .p7-tap-hint{ font-size:12px; color:var(--ink-soft); margin:-6px 0 12px; }
  mark.p7-hl-vi{ background:var(--gold-bg); color:var(--ink); font-weight:700; font-style:italic; border-radius:3px; padding:1px 4px; }
  .p7-vi-num{ display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%; background:var(--red); color:#fff; font-size:9.5px; font-weight:800; font-style:normal; margin-right:4px; }
  .p7-speak{ border:none; background:none; cursor:pointer; font-size:13px; padding:0 2px; vertical-align:middle; }
  .p7-lesson-row{ border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; background:var(--paper); }
  .p7-due-badge{ font-size:10px; font-weight:800; background:var(--red); color:#fff; border-radius:99px; padding:2px 8px; margin-left:8px; }
  .p7-test-heading{ font-family:var(--font-display); font-size:15px; font-weight:700; margin:0 0 10px; }

  /* ============================================================
     Trang lý thuyết / bài tập / Part 7: giao diện gốc (Lora, thẻ mềm),
     chỉ thêm nền màu. Đầu trang + trang chủ dùng giao diện nb-*.
     ============================================================ */
  html:root, html:root[data-theme="dark"], html:root[data-theme="light"]{
    --paper:#fdfcfa; --paper-2:#f2efe9; --ink:#181310; --ink-soft:#655c54; --line:#e4ded3;
    --red:#b3122e; --red-deep:#7a0a1f; --red-ink:#7a0a1f;
    --gold:#96650a; --gold-bg:#f6efdd;
    --green:#1e7a4c; --green-bg:#e7f4ec;
    --amber:#96650a; --amber-bg:#f6efdd;
    --card-shadow: 0 1px 0 rgba(24,19,16,.05), 0 22px 44px -26px rgba(24,19,16,.4);
    --focus: 0 0 0 3px rgba(179,18,46,.28);
    --font-display:"Lora","Georgia",serif;
    color-scheme: light;
  }
  body{ background:#fffaf7; }
  body.nb-inner{ background-color:#ffe6e1; background-image:linear-gradient(rgba(224,16,43,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(224,16,43,.07) 1px,transparent 1px); background-size:28px 28px; background-attachment:fixed; }
  .themeBtn{ display:none; }
  .quiz-toolbar{ z-index:80; }
  @media (max-width:720px){ body.az-has-lumina .quiz-toolbar{ padding-right:84px; } }

  /* ---- Lumina — linh vật sư tử AZ (lấy từ AZEnglish Vocab Arena) ---- */
  .azl{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:0;z-index:75;width:86px;pointer-events:none}
  .azl-body{pointer-events:auto;display:block;width:100%;padding:0;margin:0;border:0;background:none;cursor:pointer;transform:translateY(40%);transition:transform .45s cubic-bezier(.34,1.56,.64,1);-webkit-tap-highlight-color:transparent}
  .azl.enter .azl-body{transform:translateY(105%)}
  .azl.up .azl-body{transform:translateY(12%)}
  .azl-move{position:relative;display:block;transform-origin:50% 100%}
  .azl-rig{position:relative;display:block;transform-origin:50% 100%;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3));animation:azlBreath 3.4s ease-in-out infinite}
  .azl-rig img{display:block;width:100%;height:auto}
  .azl-rig .tl,.azl-hd{position:absolute;left:0;top:0;width:100%;height:100%}
  .azl-rig .tl{transform-origin:30.65% 75.38%;animation:azlTail 1.8s ease-in-out infinite}
  .azl-hd{transform-origin:51.08% 43.27%;animation:azlHead 4.6s ease-in-out infinite}
  .azl-hd img{position:absolute;inset:0}
  .azl-lid{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#FFDDB8,#F6C99C);border-bottom:2px solid #4A2A22;transform:scaleY(0);transform-origin:50% 0;animation:azlBlink 4.2s infinite}
  .azl-lid.l{left:36.84%;top:24.62%;width:13.00%;height:7.31%}
  .azl-lid.r{left:61.30%;top:21.15%;width:10.53%;height:7.69%;animation-delay:.03s}
  .azl.happy .azl-rig .tl{animation-duration:.45s}
  .azl.sad .azl-hd{animation:azlHeadSad 1.4s ease forwards}
  .azl.nod .azl-hd{animation:azlNod .5s ease 2}
  .azl.zz .azl-lid{animation:none;transform:scaleY(1)}
  .azl.zz .azl-rig .tl{animation-duration:4s}
  .azl.zz .azl-hd{animation:azlHeadSleep 2.6s ease-in-out infinite}
  @keyframes azlTail{0%,100%{transform:rotate(-7deg)}
  50%{transform:rotate(11deg)}
  }
  @keyframes azlHead{0%,100%{transform:rotate(-2deg)}
  50%{transform:rotate(2.5deg)}
  }
  @keyframes azlHeadSad{0%{transform:none}
  30%,100%{transform:rotate(-7deg) translateY(2px)}
  }
  @keyframes azlHeadSleep{0%,100%{transform:rotate(-5deg) translateY(3px)}
  50%{transform:rotate(-7deg) translateY(5px)}
  }
  @keyframes azlNod{0%,100%{transform:none}
  50%{transform:rotate(3deg) translateY(4px)}
  }
  @keyframes azlBlink{0%,90%,100%{transform:scaleY(0)}
  94%,96%{transform:scaleY(1)}
  }
  .azl-shades{position:absolute;left:53%;top:29%;font-size:30px;line-height:1;transform:translate(-50%,-260%);opacity:0;transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .2s}
  .azl.cool .azl-shades{transform:translate(-50%,-50%) rotate(-4deg);opacity:1}
  .azl-bub{position:absolute;z-index:3;right:4px;bottom:92px;width:max-content;max-width:min(230px,70vw);background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:16px 16px 4px 16px;padding:8px 12px;font:700 13.5px/1.35 var(--font-body,system-ui);box-shadow:0 8px 22px rgba(0,0,0,.22);transform-origin:90% 100%;animation:azlBub .35s cubic-bezier(.34,1.56,.64,1);transition:bottom .45s}
  .azl.up .azl-bub{bottom:128px}
  .azl-fx{position:absolute;z-index:1;left:50%;top:10px;width:0;height:0}
  .azl-body{position:relative;z-index:2}
  .azl-p{position:absolute;left:0;top:0;font-size:20px;line-height:1;pointer-events:none;animation:azlPop .95s ease-out forwards}
  .azl-move.hop{animation:azlHop .62s ease}
  .azl-move.tilt{animation:azlTilt .9s ease}
  .azl-move.spin{animation:azlSpin 1.1s cubic-bezier(.3,1.3,.5,1)}
  .azl-move.wig{animation:azlWig .6s ease}
  .azl-move.doze{animation:azlDoze 2.6s ease-in-out infinite}
  @keyframes azlBreath{0%,100%{transform:scale(1,1)}
  50%{transform:scale(1.015,1.035)}
  }
  @keyframes azlHop{0%{transform:none}
  30%{transform:translateY(-24px) rotate(-5deg)}
  55%{transform:translateY(0) scale(1.07,.93)}
  75%{transform:translateY(-8px)}
  100%{transform:none}
  }
  @keyframes azlTilt{0%{transform:none}
  15%{transform:rotate(-10deg)}
  25%{transform:rotate(-7deg)}
  35%{transform:rotate(-10deg)}
  75%{transform:rotate(-10deg)}
  100%{transform:none}
  }
  @keyframes azlSpin{0%{transform:none}
  45%{transform:translateY(-46px) rotateY(180deg)}
  80%{transform:translateY(0) rotateY(360deg) scale(1.06,.94)}
  100%{transform:rotateY(360deg)}
  }
  @keyframes azlWig{0%,100%{transform:none}
  20%{transform:rotate(7deg)}
  40%{transform:rotate(-7deg)}
  60%{transform:rotate(5deg)}
  80%{transform:rotate(-3deg)}
  }
  @keyframes azlDoze{0%,100%{transform:rotate(-3deg)}
  50%{transform:rotate(3deg) translateY(2px)}
  }
  @keyframes azlBub{from{transform:scale(.4);opacity:0}
  to{transform:none;opacity:1}
  }
  @keyframes azlPop{0%{transform:translate(-50%,0) scale(.3);opacity:1}
  70%{opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(1.1) rotate(var(--r));opacity:0}
  }
  .azl-conf{position:fixed;inset:0;pointer-events:none;z-index:10050;overflow:hidden}
  .azl-conf i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:azlFall linear forwards}
  @keyframes azlFall{to{transform:translate(var(--dx),108vh) rotate(var(--r))}
  }
  @media(min-width:720px){.azl{width:104px;right:18px}
  .azl-bub{bottom:110px}
  .azl.up .azl-bub{bottom:152px}
  }
  @media(prefers-reduced-motion:reduce){.azl-move,.azl-rig,.azl-rig .tl,.azl-hd,.azl-lid,.azl-p,.azl-conf{animation:none!important}
  .azl-body{transition:none}
  }
  .azl{ transition:bottom .25s; }
  @media (prefers-reduced-motion:reduce){ .azl-bub{ animation:none; } }

  /* ---- BÀI TẬP: font chuyên nghiệp (14/11/2026) — câu tiếng Anh dùng Source Serif 4 như đề in, tiếng Việt Be Vietnam Pro ---- */
  body .q-block{ padding:22px 0; }
  body .q-block .q-num{ display:flex; align-items:center; gap:8px; font:700 11.5px/1 "Be Vietnam Pro",system-ui,sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px; font-variant-numeric:tabular-nums; }
  body .q-block .q-num .qn{ display:inline-grid; place-items:center; min-width:30px; height:24px; padding:0 8px; border-radius:6px; background:var(--red); color:#fff; letter-spacing:0; font-size:12.5px; }
  body .q-block .q-num .qsrc{ margin-left:auto; text-transform:none; letter-spacing:0; font-weight:600; font-size:11.5px; color:#8F6E24; background:rgba(184,145,58,.12); border:1px solid rgba(184,145,58,.35); padding:4px 8px; border-radius:999px; }
  body .q-block .q-text{ font-family:"Source Serif 4","Charter","Georgia",serif; font-size:18px; line-height:1.6; font-weight:500; letter-spacing:.003em; color:var(--ink); margin:0 0 14px; font-optical-sizing:auto; }
  body .q-block .q-text.vi{ font-family:"Be Vietnam Pro",system-ui,sans-serif; font-size:14.5px; font-weight:600; color:var(--ink-soft); }
  body .q-block .opt-row{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  @media (max-width:620px){ body .q-block .opt-row{ grid-template-columns:1fr; } }
  body .q-block .opt-btn{ font-family:"Source Serif 4","Charter","Georgia",serif; font-size:16.5px; line-height:1.45; padding:12px 14px; align-items:center; }
  body .q-block .opt-btn b{ font:700 12px/1 "Be Vietnam Pro",system-ui,sans-serif; width:24px; height:24px; border-radius:6px; }
  body .q-block .explain-box{ font-family:"Be Vietnam Pro",system-ui,sans-serif; font-size:14px; line-height:1.7; color:var(--ink); background:var(--paper-2); border-left:3px solid #B8913A; border-radius:8px; padding:12px 14px; }
  body .q-block .explain-box .ans{ display:block; font-weight:700; color:var(--green); margin-bottom:4px; }
  body .q-block .ets-pass{ font-family:"Source Serif 4","Charter","Georgia",serif; font-size:15.5px; line-height:1.7; background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:0 0 12px; white-space:pre-line; max-height:300px; overflow:auto; }
  body .q-block .ets-pass .pt{ display:block; font:700 11px/1.2 "Be Vietnam Pro",system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px; }
  body .q-block .ets-pass mark{ background:rgba(215,25,45,.12); color:var(--red); font-weight:700; padding:1px 4px; border-radius:4px; }
  /* ---- mục Luyện đề thật ETS ---- */
  .ets-head{ background:linear-gradient(150deg,#0B1424 0%,#13233B 100%); color:#fff; border-radius:16px; padding:24px; margin-bottom:18px; }
  .ets-head .eb{ font:700 11.5px/1.2 "Be Vietnam Pro",sans-serif; letter-spacing:.1em; text-transform:uppercase; color:#E3C27A; }
  .ets-head h2{ color:#fff; font-size:26px; margin:8px 0 8px; }

<script type="text/azt" id="aztMain">
(function(){
  "use strict";

  // ---------- THEME ----------
  var themeBtn = document.getElementById('themeBtn');
  function applyTheme(t){ document.documentElement.setAttribute('data-theme', t); try{localStorage.setItem('az_toeicgrammar_theme', t);}catch(e){} }
  (function initTheme(){ try{ var t = localStorage.getItem('az_toeicgrammar_theme'); if(t) applyTheme(t); }catch(e){} })();
  themeBtn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var isDark = cur === 'dark' || (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
    applyTheme(isDark ? 'light' : 'dark');
  });

  // ---------- PROGRESS STORE ----------
  var PROGRESS_KEY = 'az_toeicgrammar_progress';
  function getProgress(){ try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}'); }catch(e){ return {}; } }
  function saveProgress(p){ try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }catch(e){} }
  function getStudent(){ try{ return JSON.parse(localStorage.getItem(window.AZ_STUDENT_KEY) || 'null'); }catch(e){ return null; } }

  function recordQuizResult(topicId, quizId, score, total, mode){
    var p = getProgress();
    if(!p[topicId]) p[topicId] = {};
    var prev = p[topicId][quizId];
    var attempts = (prev && prev.attempts ? prev.attempts : 0) + 1;
    var bestScore = prev && prev.bestScore !== undefined ? Math.max(prev.bestScore, score) : score;
    p[topicId][quizId] = {bestScore:bestScore, lastScore:score, total:total, attempts:attempts, lastMode:mode, lastAt:new Date().toISOString()};
    saveProgress(p);
    if(window.AZT) AZT.xp('G', topicId + '/' + quizId, score, total);

    var student = null;
    if(window.AZ_LEAD_WEBHOOK_URL && student){
      try{
        fetch(window.AZ_LEAD_WEBHOOK_URL, {
          method:"POST", mode:"no-cors",
          headers:{"Content-Type":"text/plain;charset=utf-8"},
          body: JSON.stringify({
            type:"score", source:"AZTOEIC-Grammar-Vocab-Trainer",
            name:student.name, email:student.email, phone:student.phone,
            topic:topicId, quiz:quizId, score:score, total:total, mode:mode,
            submittedAt:new Date().toISOString()
          })
        });
      }catch(e){}
    }
  }

  function topicStats(topicId){
    var topic = DATA[topicId];
    var p = getProgress()[topicId] || {};
    var totalQuizzes = topic.quizzes.length;
    var doneQuizzes = 0, sumBest = 0, sumTotal = 0;
    topic.quizzes.forEach(function(q){
      var rec = p[q.id];
      if(rec){ doneQuizzes++; sumBest += rec.bestScore; sumTotal += rec.total; }
    });
    return {totalQuizzes:totalQuizzes, doneQuizzes:doneQuizzes, pct: totalQuizzes ? Math.round(doneQuizzes/totalQuizzes*100) : 0, avgPct: sumTotal ? Math.round(sumBest/sumTotal*100) : null};
  }

  function overallStats(){
    var ids = Object.keys(DATA);
    var totalQuizzes = 0, doneQuizzes = 0, sumBest = 0, sumTotal = 0, topicsStarted = 0;
    ids.forEach(function(id){
      var s = topicStats(id);
      totalQuizzes += s.totalQuizzes; doneQuizzes += s.doneQuizzes;
      if(s.doneQuizzes > 0) topicsStarted++;
      var p = getProgress()[id] || {};
      DATA[id].quizzes.forEach(function(q){ var r = p[q.id]; if(r){ sumBest += r.bestScore; sumTotal += r.total; } });
    });
    return {
      totalTopics: ids.length, topicsStarted: topicsStarted,
      totalQuizzes: totalQuizzes, doneQuizzes: doneQuizzes,
      avgPct: sumTotal ? Math.round(sumBest/sumTotal*100) : 0
    };
  }

  // ---------- DATA ----------
  var DATA = window.AZ_GRAMMAR_DATA;
  var topicOrder = Object.keys(DATA).sort(function(a,b){ return DATA[a].order - DATA[b].order; });

  // ---------- ROUTER ----------
  var root = document.getElementById('viewRoot');
  document.getElementById('homeLink').addEventListener('click', function(){ location.hash = '#/'; });
  document.getElementById('homeLogo').addEventListener('click', function(){ location.hash = '#/'; });

  function route(){
    var hash = location.hash || '#/';
    var parts = hash.replace('#/','').split('/').filter(Boolean);
    window.scrollTo(0,0);
    nbUpdateTop();
    document.body.classList.toggle('nb-inner', parts[0] === 'topic' || parts[0] === 'quiz' || parts[0] === 'p7' || parts[0] === 'ets');
    if(parts[0] !== 'quiz') AZLumina.hide();
    document.getElementById('appWrap').classList.toggle('nb-wide', !(parts[0] === 'topic' || parts[0] === 'quiz' || parts[0] === 'p7' || parts[0] === 'ets'));
    if(parts.length === 0){ renderDashboard(); }
    else if(parts[0] === 'grammar'){ renderGrammarList(); }
    else if(parts[0] === 'ets' || (parts[0] === 'topic' && parts[1] === 'ets')){ renderEts(parts[0] === 'ets' ? parts[1] : null); }
    else if(parts[0] === 'topic' && parts[1]){ renderTopic(parts[1]); }
    else if(parts[0] === 'quiz' && parts[1] && parts[2]){ renderQuizIntro(parts[1], parts[2]); }
    else if(parts[0] === 'p7' && !window.AZ_P7_LESSONS){ location.href = '../#hoc-vien'; return; }
    else if(parts[0] === 'p7' && !parts[1]){ renderP7Dashboard(); }
    else if(parts[0] === 'p7' && parts[1] === 'review'){ renderP7Review(); }
    else if(parts[0] === 'p7' && parts[1] && parts[2]){ renderP7Lesson(parts[1], parts[2]); }
    else { renderDashboard(); }
  }
  window.addEventListener('hashchange', route);

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // ---------- DASHBOARD ----------
  var TOPIC_GROUPS = [

  var ETS_SET = 25;
  function etsItems(){
    var a = (window.AZ_GRAMMAR_ETS || []).concat(window.AZ_GRAMMAR_ETS_LOP || []);
    return a.slice().sort(function(x, y){ return topicOrder.indexOf(x.topic) - topicOrder.indexOf(y.topic) || (y.y || 2026) - (x.y || 2026) || x.t - y.t || x.n - y.n; });
  }
  function etsSets(){

  // ---------- PART 7: AZ DAILY 15 ----------
  var P7_KEY = 'az_toeicgrammar_p7d15';
  var P7_INTERVALS = [1,3,7,14,30];
  function p7Today(){ return new Date().toISOString().slice(0,10); }
  function p7AddDays(n){ var d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
  function getP7State(){ try{ return JSON.parse(localStorage.getItem(P7_KEY) || '{}'); }catch(e){ return {}; } }
  function saveP7State(s){ try{ localStorage.setItem(P7_KEY, JSON.stringify(s)); }catch(e){} }
  function p7Lessons(){ return window.AZ_P7_LESSONS || []; }
  function p7LessonById(id){ return p7Lessons().filter(function(l){ return l.id === id; })[0]; }
  function p7ChunkById(id){
    var lessons = p7Lessons();
    for(var i=0;i<lessons.length;i++){
      var found = lessons[i].chunks.filter(function(c){ return c.id === id; })[0];
      if(found) return Object.assign({lessonId:lessons[i].id}, found);
    }
    return null;
  }
  function p7EnsureState(){
    var s = getP7State();
    if(!s.chunks) s.chunks = {};
    if(!s.lessons) s.lessons = {};
    p7Lessons().forEach(function(lesson){
      lesson.chunks.forEach(function(c){
        if(!s.chunks[c.id]){
          s.chunks[c.id] = { lessonId:lesson.id, chunk:c.chunk, meaningVi:c.meaningVi, dateLearned:null, nextReviewDate:null, intervalIdx:-1, correctCount:0, incorrectCount:0, lastResult:null, status:'NEW' };
        }
      });
    });
    saveP7State(s);
    return s;
  }
  function p7ApplySpaced(rec, correct){
    if(correct){
      var nextIdx = rec.intervalIdx + 1;
      if(nextIdx >= P7_INTERVALS.length){ rec.status = 'MASTERED'; rec.nextReviewDate = null; rec.intervalIdx = P7_INTERVALS.length - 1; }
      else { rec.intervalIdx = nextIdx; rec.nextReviewDate = p7AddDays(P7_INTERVALS[nextIdx]); rec.status = 'REVIEW'; }
      rec.correctCount++; rec.lastResult = 'correct';
    } else {
      rec.intervalIdx = -1; rec.nextReviewDate = p7AddDays(1); rec.status = 'LEARNING';
      rec.incorrectCount++; rec.lastResult = 'incorrect';
    }
  }
  function p7Shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function p7EscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  // field = 'chunk' (English options) or 'meaningVi' (Vietnamese options)
  function p7BuildOptions(lesson, correctChunk, field){
    var pool = lesson.chunks.filter(function(c){ return c.id !== correctChunk.id; }).map(function(c){ return c[field]; });
    var distractors = p7Shuffle(pool).slice(0,3);
    if(distractors.length < 3){
      var extra = [];
      p7Lessons().forEach(function(ls){ if(ls.id !== lesson.id) ls.chunks.forEach(function(c){ extra.push(c[field]); }); });
      distractors = p7Shuffle(distractors.concat(p7Shuffle(extra))).slice(0,3);
    }
    return p7Shuffle(distractors.concat([correctChunk[field]]));
  }
  function p7HighlightChunksInPassage(lesson, phraseList){
    var sorted = phraseList.filter(Boolean).slice().sort(function(a,b){ return b.length-a.length; });
    var pattern = sorted.length ? new RegExp('(' + sorted.map(p7EscRe).join('|') + ')', 'gi') : null;
    var idxByLower = {};
    lesson.chunks.forEach(function(c, i){ idxByLower[c.chunk.toLowerCase()] = i; });
    return lesson.passage.paragraphs.map(function(p){ return pattern ? esc(p.en).replace(pattern, function(m){

  // Tap a highlighted chunk in the passage → small popover with Vietnamese meaning + audio
  function p7ClosePopover(){ var el = document.getElementById('p7Pop'); if(el) el.remove(); }
  // Popover anchored under (or above) the tapped element; tapping the same element again closes it
  function p7OpenPopover(target, key, innerHtml){
    var wasOpen = document.getElementById('p7Pop');
    var sameTarget = wasOpen && wasOpen.getAttribute('data-key') === key;
    p7ClosePopover();
    if(sameTarget) return;
    var pop = document.createElement('div');

    pop.innerHTML = innerHtml;
    pop.addEventListener('click', function(e){ e.stopPropagation(); });
    document.body.appendChild(pop);
    var r = target.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight, vw = document.documentElement.clientWidth;
    var left = Math.max(8, Math.min(r.left + window.scrollX + r.width/2 - pw/2, window.scrollX + vw - pw - 8));
    var top = r.bottom + window.scrollY + 6;
    if(r.bottom + ph + 12 > window.innerHeight && r.top - ph - 6 > 0) top = r.top + window.scrollY - ph - 6;
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
    target.classList.add('p7-hl-active');
    var obs = new MutationObserver(function(){ if(!document.getElementById('p7Pop')){ target.classList.remove('p7-hl-active'); obs.disconnect(); } });
    obs.observe(document.body, {childList:true});
  }
  window.AZ_p7ShowMeaning = function(ev, lessonId, idx){

  // "Từ khó trong cụm" block: every key word of the chunk with POS, meaning and its own audio button

  // ---- Key words inside each memory chunk (1–2 per chunk, from window.AZ_P7_KEYWORDS) ----
  function p7Keywords(chunkId){ return (window.AZ_P7_KEYWORDS || {})[chunkId] || []; }
  // Chunk text with its key words wrapped in tappable spans (first occurrence of each)
  function p7ChunkKeywordHtml(lesson, idx){
    var c = lesson.chunks[idx], text = c.chunk;
    // locate each key word on the raw text first (first whole-word occurrence), then build HTML once
    var spans = [];
    p7Keywords(c.id).forEach(function(kw, ki){
      var re = new RegExp('(^|[^A-Za-z\'’])(' + p7EscRe(kw[0]) + ')(?![A-Za-z\'’-])', 'g'), m;
      while((m = re.exec(text))){
        var start = m.index + m[1].length, end = start + m[2].length;
        if(!spans.some(function(sp){ return start < sp.end && end > sp.start; })){ spans.push({start:start, end:end, ki:ki}); break; }
        re.lastIndex = m.index + 1;
      }
    });
    spans.sort(function(x,y){ return x.start - y.start; });
    var html = '', pos = 0;
    spans.forEach(function(sp){
      var call = 'AZ_p7ShowKeyword(event,\'' + lesson.id + '\',' + idx + ',' + sp.ki + ')';
      html += esc(text.slice(pos, sp.start)) + '<span class="p7-kw" role="button" tabindex="0" title="Bấm để xem nghĩa từ" onclick="' + call + '" onkeydown="if(event.key===\'Enter\'){' + call + ';}">' + esc(text.slice(sp.start, sp.end)) + '</span>';

  window.AZ_p7ShowKeyword = function(ev, lessonId, idx, ki){

    sentEn = sentEn.replace(wordRe, function(all, pre, w){ return pre + '<mark class="p7-hl">' + w + '</mark>'; });
    var html = '<div class="p7-pop-en">' + esc(kw[0]) + ' <button class="p7-speak" onclick="AZ_p7SpeakKeyword(\'' + lessonId + '\',' + idx + ',' + ki + ')" title="Nghe phát âm">🔊</button></div>';

  // Substitutes the given chunk ids (English text) with a numbered Vietnamese-meaning marker,
  // wherever they appear in the passage — used by Remember Layer 2 and Review Layer 2 so the
  // student sees the vocabulary embedded in a real sentence, not as an isolated flashcard.
  function p7ViSubstitutedHtml(lesson, chunkIds, numOffset){
    var chunks = chunkIds.map(function(id){ return lesson.chunks.filter(function(c){ return c.id === id; })[0]; }).filter(Boolean);
    var numByLower = {};
    chunks.forEach(function(c, i){ numByLower[c.chunk.toLowerCase()] = { num: numOffset+i+1, vi: c.meaningVi }; });
    var sorted = chunks.map(function(c){ return c.chunk; }).sort(function(a,b){ return b.length-a.length; });
    var pattern = sorted.length ? new RegExp('(' + sorted.map(p7EscRe).join('|') + ')', 'gi') : null;
    var html = '';
    lesson.passage.paragraphs.forEach(function(p){
      var escaped = esc(p.en);
      var out = !pattern ? escaped : escaped.replace(pattern, function(m){
        var info = numByLower[m.toLowerCase()];

      html += '<div class="p7-passage-para">' + out.replace(/\n/g,'<br>') + '</div>';

  // ---- Audio for vocabulary only (Web Speech API, prefers a Natural/Neural voice) ----
  var p7Voice = null;
  function p7PickVoice(){
    if(p7Voice) return p7Voice;
    if(!('speechSynthesis' in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    var en = voices.filter(function(v){ return /^en/i.test(v.lang); });
    p7Voice = en.find(function(v){ return /natural|neural/i.test(v.name); })
      || en.find(function(v){ return /google/i.test(v.name) && /us/i.test(v.name); })
      || en.find(function(v){ return /google/i.test(v.name); })
      || en.find(function(v){ return v.lang === 'en-US'; })
      || en[0] || null;
    return p7Voice;

  }

  window.AZ_p7ReviewGoL2 = function(){
    p7rv.phase = 'l2';
    p7rv.dueIds.forEach(function(id){ var c = p7ChunkById(id); var lesson = p7LessonById(c.lessonId); p7rv.l2Options[id] = p7BuildOptions(lesson, c, 'chunk'); });

  };
  function p7RenderReviewL2(){
    var html = '<p class="desc">Lớp 2/2 · Đoạn văn thay các cụm đến hạn bằng nghĩa tiếng Việt — chọn đúng cụm tiếng Anh.</p>';
    var byLesson = {}; var order = [];
    p7rv.dueIds.forEach(function(id){ var c = p7ChunkById(id); if(!byLesson[c.lessonId]){ byLesson[c.lessonId] = []; order.push(c.lessonId); } byLesson[c.lessonId].push(id); });

    });
    p7rv.dueIds.forEach(function(id, qi){
      var c = p7ChunkById(id);
      var options = p7rv.l2Options[id];
      var picked = p7rv.l2Answers[id];
      var correctIdx = options.indexOf(c.chunk);
      html += '<div class="q-block"><p class="q-text"><span class="p7-vi-num" style="background:var(--ink);">' + (qi+1) + '</span> "' + esc(c.meaningVi) + '" trong câu trên = ?</p><div class="opt-row">';
      options.forEach(function(opt, ci){

        html += '<button class="' + cls + '" ' + (picked!==undefined?'disabled':'') + ' onclick="AZ_p7ReviewAnswerL2(\'' + id + '\',' + ci + ')"><b>' + String.fromCharCode(65+ci) + '</b><span>' + esc(opt) + '</span></button>';
      });
      html += '</div></div>';
    });
    var canFinish = p7rv.dueIds.every(function(id){ return p7rv.l2Answers[id] !== undefined; });
    html += '<div class="btn-row"><button class="btn btn-primary" ' + (canFinish?'':'disabled') + ' onclick="AZ_p7ReviewFinish()">Hoàn thành ôn tập ✓</button></div>';
    return html;
  }
  window.AZ_p7ReviewAnswerL2 = function(chunkId, ci){
    p7rv.l2Answers[chunkId] = ci;
    var c = p7ChunkById(chunkId);
    var l1ok = p7rv.l1Options[chunkId][p7rv.l1Answers[chunkId]] === c.chunk;
    var l2ok = p7rv.l2Options[chunkId][ci] === c.chunk;
    var s = p7EnsureState();
    p7ApplySpaced(s.chunks[chunkId], l1ok && l2ok);
    saveP7State(s);
    renderP7Review();
  };
  window.AZ_p7ReviewFinish = function(){ p7rv = null; location.hash = '#/p7'; };
  window.AZ_p7ReviewExit = function(){ p7rv = null; location.hash = '#/p7'; };

  // ---------- INIT ----------
  window.AZ_APP_INIT = function(){ route(); };
  route();
})();
</script>

<script>window.AZT_ROOT="../";</script><script>/* AZTOEIC Academy — thư viện dùng chung cho mọi trang (cổng, đề ETS, ngữ pháp, Listening Lab).
